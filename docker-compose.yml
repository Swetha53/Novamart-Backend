version: '4'
services:
  mongodb:
    image: mongo:7.0.5
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./data:/data/db
    networks:
      - novamart-network
  mysql:
    image: mysql:8.3.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/mysql/inti.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - novamart-network
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
    networks:
      - novamart-network
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    command: >
      bash -c "until nc -z -v -w30 zookeeper 2181; do echo 'Waiting for Zookeeper...'; sleep 5; done; 
      /etc/confluent/docker/run"
    networks:
      - novamart-network
  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - novamart-network
  reality:
    build: './reality-service'
    container_name: reality
    ports:
      - "8443:8443"
    environment:
      SUPABASE_URL: 'https://reggvbnnkqmprlkojomx.supabase.co'
      SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZ2d2Ym5ua3FtcHJsa29qb214Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDE3MjE4MTEsImV4cCI6MjA1NzI5NzgxMX0.Su8o1VD0lIwWi_xqXa2M5SOI_FsMenv9_jzoFh9h2wg'
    volumes:
      - ./reality-service/cert.pem:/app/cert.pem
      - ./reality-service/key.pem:/app/key.pem
    networks:
      - novamart-network
  product:
    build: './product-service'
    container_name: product
    ports:
      - "8080:8443"
    depends_on:
      - kafka
      - mongodb
      - inventory
      - reality
      - user
    volumes:
      - ./product-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATA_MONGODB_URI: 'mongodb://root:password@mongodb:27017/product-service?authSource=admin'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  order:
    build: './order-service'
    container_name: order
    ports:
      - "8081:8443"
    depends_on:
      - kafka
      - mysql
      - cart
      - inventory
      - user
    volumes:
      - ./order-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/order_service'
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: 'mysql'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  cart:
    build: './cart-service'
    container_name: cart
    ports:
      - "8082:8443"
    depends_on:
      - kafka
      - mysql
      - product
      - user
    volumes:
      - ./cart-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/cart_service'
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: 'mysql'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  payment:
    build: './payment-service'
    container_name: payment
    ports:
      - "8083:8443"
    depends_on:
      - kafka
      - mysql
      - user
    volumes:
      - ./payment-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/payment_service'
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: 'mysql'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  inventory:
    build: './inventory-service'
    container_name: inventory
    ports:
      - "8084:8443"
    depends_on:
      - kafka
      - mysql
    volumes:
      - ./inventory-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/inventory_service'
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: 'mysql'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  user:
    build: './user-service'
    container_name: user
    ports:
      - "8085:8443"
    depends_on:
      - kafka
      - mongodb
    volumes:
      - ./user-service/keystore.p12:/app/keystore.p12
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_DATA_MONGODB_URI: 'mongodb://root:password@mongodb:27017/user-service?authSource=admin'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
  search:
    build: './search-service'
    container_name: search
    ports:
      - "8086:8443"
    depends_on:
      - kafka
      - elasticsearch
      - zookeeper
    volumes:
      - ./search-service/keystore.p12:/app/keystore.p12
    environment:
      DEVTIRO_KAFKA_TOPIC: 'product'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_ELASTICSEARCH_URIS: 'http://elasticsearch:9200'
      SPRING_PROFILES_ACTIVE: 'prod'
  notification:
    build: './notification-service'
    container_name: notification
    ports:
      - "8087:8443"
    depends_on:
      - kafka
    volumes:
      - ./notification-service/keystore.p12:/app/keystore.p12
    environment:
      DEVTIRO_KAFKA_TOPICS: 'order-placed, order-delivered, order-cancelled, payment-completed, refund-initiated, refund-completed, review-added, profile-completed, profile-updated, profile-deleted'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      SPRING_PROFILES_ACTIVE: 'prod'
    networks:
      - novamart-network
networks:
  novamart-network:
    driver: bridge